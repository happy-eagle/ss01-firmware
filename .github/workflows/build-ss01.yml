name: Build ImmortalWrt - JDCloud RE-SS-01 (亚瑟 AX1800 Pro)

on:
  workflow_dispatch:
    inputs:
      src_repo:
        description: "源码仓库"
        required: false
        default: "https://github.com/VIKINGYFY/immortalwrt.git"
      src_branch:
        description: "源码分支"
        required: false
        default: "owrt"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      SRC_REPO: ${{ github.event.inputs.src_repo || 'https://github.com/VIKINGYFY/immortalwrt.git' }}
      SRC_BRANCH: ${{ github.event.inputs.src_branch || 'owrt' }}

    steps:
      - name: 检出编译脚本
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: 安装编译依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools python3-pip rsync unzip zlib1g-dev file wget \
            libelf-dev swig time cpio subversion qemu-utils

      - name: 拉取源码
        run: |
          git clone --depth 1 -b "$SRC_BRANCH" "$SRC_REPO" openwrt
          cd openwrt
          echo "源码提交: $(git log -1 --format='%h %ci %s')"
          echo "内核: $(cat target/linux/qualcommax/Makefile | grep KERNEL_PATCHVER)"

      - name: 定制 feeds / 插件 / 内核核心
        run: |
          chmod +x scripts/diy.sh
          OPENWRT_DIR="$PWD/openwrt" bash scripts/diy.sh

      - name: 下载源码包
        run: |
          cd openwrt
          make -j"$(nproc)" download || make -j"$(nproc)" download

      - name: 编译固件
        run: |
          cd openwrt
          make -j"$(nproc)" || make -j1 V=s

      - name: 收集产物
        if: always()
        run: |
          mkdir -p out
          cd openwrt
          cp -v bin/targets/qualcommax/ipq60xx/*-factory.bin   ../out/ 2>/dev/null || true
          cp -v bin/targets/qualcommax/ipq60xx/*-sysupgrade.bin ../out/ 2>/dev/null || true
          cp -v bin/targets/qualcommax/ipq60xx/sha256sums       ../out/ 2>/dev/null || true
          cp -v bin/targets/qualcommax/ipq60xx/config.buildinfo ../out/ 2>/dev/null || true
          cp -v .config ../out/config.txt 2>/dev/null || true
          echo "===== 产物列表 ====="
          ls -lh ../out || true

      - name: 上传固件
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: immortalwrt-ss01-${{ github.run_number }}
          path: out/*
          if-no-files-found: warn
          retention-days: 30
